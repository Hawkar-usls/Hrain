name: HRain DemiHead local proposal acceptance gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Re-run read-only hemisphere bridge contract
        run: node tools/test-demihead-bridge.js
      - name: Run explicit local proposal acceptance gate
        run: node tools/test-demihead-apply.js
      - name: Static local-only boundary audit
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const page = fs.readFileSync('demihead-apply.html','utf8');
          const adapter = fs.readFileSync('demihead-apply.js','utf8');
          for (const forbidden of ['postMessage(', 'fetch(', 'XMLHttpRequest', 'api.github.com/repos/']) {
            if (page.includes(forbidden) || adapter.includes(forbidden)) throw new Error(`forbidden channel: ${forbidden}`);
          }
          if ((page.match(/localStorage\.setItem/g)||[]).length !== 1) throw new Error('apply page must expose exactly one localStorage write');
          if (adapter.includes('localStorage.setItem')) throw new Error('pure adapter must not perform I/O');
          if (!page.includes('ACCEPT LOCALLY') || !page.includes('DECLINE')) throw new Error('explicit choice controls missing');
          if (!page.includes('GITHUB_PAGES_PROJECT_PATH != ORIGIN_ISOLATION')) throw new Error('same-origin threat model law missing');
          if (!page.includes('CLICK_EVENT != VERIFIED_HUMAN_IDENTITY')) throw new Error('identity claim ceiling missing');
          console.log('LOCAL_ONLY_APPLY_SURFACE=PASS');
          NODE
