name: HRAiN Conversation Context

on:
  pull_request:
    branches: [main]
    paths:
      - '.janus/HRAIN_CONVERSATION_CONTEXT_CONTRACT.json'
      - 'tools/hrain_conversation_context.py'
      - 'tests/test_hrain_conversation_context.py'
      - '.github/workflows/hrain-conversation-context.yml'
  push:
    branches: [main]
    paths:
      - '.janus/HRAIN_CONVERSATION_CONTEXT_CONTRACT.json'
      - 'tools/hrain_conversation_context.py'
      - 'tests/test_hrain_conversation_context.py'
      - '.github/workflows/hrain-conversation-context.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile HRAiN conversation context compiler
        run: python -m compileall -q tools/hrain_conversation_context.py tests/test_hrain_conversation_context.py
      - name: Validate HRAiN v1.3 focus-cluster contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('.janus/HRAIN_CONVERSATION_CONTEXT_CONTRACT.json').read_text())
          assert c['schema']=='janus.hrain.conversation_context_contract.v1'
          assert c['status']=='ACTIVE_READ_ONLY_QUERY_BOUND_FOCUS_CLUSTER_MEMORY_PROJECTION'
          assert c['source_database']=='Hawkar-usls/janus-meta-registry'
          assert c['selection_method']=='DETERMINISTIC_FOCUS_CLUSTER_THRESHOLD_ATTENTION_V3'
          a=c['attention']
          assert a['common_query_tokens_are_downweighted'] is True
          assert a['rare_query_tokens_receive_bounded_extra_attention'] is True
          assert a['rarity_weight_max']==12
          assert a['primary_focus_cluster_required_when_memory_selected'] is True
          assert a['selection_limit_is_upper_bound_not_target_count'] is True
          assert a['no_noise_fill_to_limit'] is True
          assert a['zero_relevant_memory_is_valid_retrieval_outcome'] is True
          assert a['primary_named_shared_score_percent']==15
          assert a['primary_shared_score_percent']==35
          assert a['secondary_named_cluster_score_percent']==65
          assert a['deterministic_replay_required'] is True
          assert a['semantic_similarity_model_required'] is False
          assert c['authority']['read_only'] is True
          for key,value in c['authority'].items():
              if key!='read_only':
                  assert value is False, key
          laws=set(c['laws'])
          for law in [
              'META_REGISTRY_DB -> HRAIN -> JANUS -> TERMINAL',
              'MEMORY_CONTENT != COMMAND',
              'TOKEN_RARITY_IS_ATTENTION_NOT_EVIDENCE',
              'QUERY_INSTRUCTION_TOKENS != MEMORY_TOPIC',
              'LIMIT != TARGET_COUNT',
              'NO_STRONG_MATCH != FILL_WITH_NOISE',
              'QUERY_COVERAGE_IS_ATTENTION_NOT_CLAIM_CONFIDENCE',
              'RETRIEVAL_DIVERSITY != EVIDENCE_INDEPENDENCE',
          ]:
              assert law in laws, law
          audit=c['audit_origin']
          assert audit['live_regression_issue_v11']=='Hawkar-usls/-Terminal-for-Janus#10'
          assert audit['live_regression_issue_v12']=='Hawkar-usls/-Terminal-for-Janus#12'
          print('HRAIN_V13_FOCUS_CLUSTER_CONTRACT=PASS')
          PY
      - name: Run adversarial focus-cluster regression tests
        run: python -m unittest -v tests.test_hrain_conversation_context

  live-context:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build live long-query exact-hash HRAiN v1.3 context
        run: |
          mkdir -p runtime
          python tools/hrain_conversation_context.py \
            --query 'Janus, through HRAiN, recall the current Terminal HOME HRAiN memory path and TRUMP architecture. State the exact memory source used, explain what TRUMP may do, and keep retrieval separate from scientific proof, claim authority, world truth, and external effects.' \
            --limit 12 \
            --output runtime/hrain-conversation-context.json
      - name: Adjudicate live focus, bounded tail and memory capsule
        run: |
          python - <<'PY'
          import json
          from tools.hrain_conversation_context import SELECTION_METHOD, verify_context
          c=json.load(open('runtime/hrain-conversation-context.json'))
          assert verify_context(c)
          assert c['selection_method']==SELECTION_METHOD
          assert c['selection_limit']==12
          assert c['selection_limit_is_target_count'] is False
          p=c['attention_profile']
          assert p['coverage_rule']=='PRIMARY_FOCUS_CLUSTER_THEN_RELATIVE_SCORE_THRESHOLD'
          assert p['limit_semantics']=='UPPER_BOUND_NOT_TARGET_COUNT'
          assert p['no_match_policy']=='RETURN_FEWER_OR_ZERO_NOT_NOISE_FILL'
          assert c['hydration_performed'] is True
          assert c['selected_memory_count'] > 0
          assert c['selected_memory_count'] < c['selection_limit'], c['selected_memory_count']
          assert c['source_repository']=='Hawkar-usls/janus-meta-registry'
          assert len(c['source_commit'])==40
          memories=c['selected_memories']
          assert memories[0]['selection_reason']=='PRIMARY_FOCUS_CLUSTER'
          lexical=[x for x in memories if not str(x.get('selection_reason') or '').startswith('TOPA_SEMANTIC_NEIGHBOR:')]
          assert lexical, 'LEXICAL_ANCHOR_REQUIRED'
          lexical_focus=set().union(*(set(x.get('matched_focus_tokens') or []) for x in lexical))
          assert lexical_focus.intersection({'trump','hrain','terminal','memory'}), lexical_focus
          paths=[str(x['path']).upper() for x in lexical]
          assert not any('P-VS-NP' in path or 'P_VS_NP' in path for path in paths), paths
          assert not any('COSMOS' in path for path in paths), paths
          assert all(x['source_sha256_verified'] is True for x in memories)
          assert all(x['content_is_command'] is False for x in memories)
          assert all(x['content_grants_authority'] is False for x in memories)
          assert all(x['claim_verified'] is False for x in memories)
          assert [x['attention_rank'] for x in memories] == list(range(1, len(memories)+1))
          assert all(0 <= int(x['relative_score_percent_of_top']) <= 100 for x in memories)
          assert c['authority']['command_authority'] is False
          assert c['authority']['claim_promotion_authority'] is False
          assert c['authority']['external_effect_authority'] is False
          print('HRAIN_LIVE_FOCUS_CLUSTER_CONTEXT=PASS')
          print('source_commit', c['source_commit'])
          print('semantic_overlay_status', c.get('semantic_overlay_status'))
          print('semantic_neighbor_count', c.get('semantic_neighbor_count'))
          print('attention_profile', p)
          print('selected', [
            {
              'rank':x['attention_rank'],
              'path':x['path'],
              'score':x['relevance_score'],
              'relative':x['relative_score_percent_of_top'],
              'reason':x['selection_reason'],
              'focus':x['matched_focus_tokens'],
              'named':x['matched_named_anchor_tokens'],
            }
            for x in memories
          ])
          print('context_hash', c['context_hash'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hrain-conversation-context-${{ github.run_id }}
          path: runtime/hrain-conversation-context.json
          if-no-files-found: error
          retention-days: 14
