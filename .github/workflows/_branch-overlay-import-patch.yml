name: TEMP HRAiN semantic overlay import patch

on:
  push:
    branches: [janus/topa-continuous-semantic-flywheel]
    paths:
      - 'tools/_patch_overlay_import_once.py'
      - '.github/workflows/_branch-overlay-import-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus/topa-continuous-semantic-flywheel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply dual import fix
        run: python tools/_patch_overlay_import_once.py
      - name: Run existing context tests before push
        run: python -m unittest -v tests.test_hrain_conversation_context
      - name: Commit compiler only
        run: |
          set -euo pipefail
          git config user.name 'janus-activator[bot]'
          git config user.email 'janus-activator[bot]@users.noreply.github.com'
          git add tools/hrain_conversation_context.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'HRaiN: support package and direct semantic overlay imports'
          git push origin HEAD:janus/topa-continuous-semantic-flywheel
