name: TEMP HRAiN live weave env patch

on:
  push:
    branches: [janus/topa-continuous-semantic-flywheel]
    paths:
      - 'tools/_patch_live_env_once.py'
      - '.github/workflows/_branch-live-env-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus/topa-continuous-semantic-flywheel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply live weave env fix and regression assertions
        run: python tools/_patch_live_env_once.py
      - name: Commit permanent files only
        run: |
          set -euo pipefail
          git config user.name 'janus-activator[bot]'
          git config user.email 'janus-activator[bot]@users.noreply.github.com'
          git add .github/workflows/hrain-topa-continuous-semantic-flywheel.yml tests/test_hrain_topa_semantic_overlay.py
          if git diff --cached --quiet; then
            echo 'LIVE_WEAVE_ENV_PATCH_NOOP=TRUE'
            exit 0
          fi
          git commit -m 'HRaiN: export frozen semantic inputs within live weave step'
          git push origin HEAD:janus/topa-continuous-semantic-flywheel
