name: HRaiN JANUS network language and semantic handoff

on:
  pull_request:
    paths:
      - 'janus.html'
      - 'janus-network-v3.js'
      - 'tools/apply_janus_network_v3.py'
      - '.github/workflows/hrain-janus-network-v3.yml'
  push:
    branches: [main]
    paths:
      - 'janus.html'
      - 'janus-network-v3.js'
      - 'tools/apply_janus_network_v3.py'
      - '.github/workflows/hrain-janus-network-v3.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: hrain-janus-network-v3
  cancel-in-progress: false

jobs:
  validate-or-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic transform in workspace
        run: python tools/apply_janus_network_v3.py
      - name: Validate network v3 invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('janus.html').read_text(encoding='utf-8')
          j=Path('janus-network-v3.js').read_text(encoding='utf-8')
          assert 'https://hawkar-usls.github.io/iNaiHR/janus.html' in s
          assert "dataset.semanticSynth='true'" in s
          assert "encodeURIComponent(node.path)" in s
          assert '<script src="./janus-network-v3.js"></script>' in s
          assert 'janus-site-language-v1' in j
          for token in ['dataset.lang','localStorage.setItem(LANG_KEY','MutationObserver','EN','UA','ru']:
              assert token in j, token
          forbidden=['/api/hrain/save','/api/hrain/event','method:\'DELETE\'','method:\'PUT\'','method:\'PATCH\'']
          for token in forbidden:
              assert token not in s+j, token
          print('LANGUAGE_SYNC=PASS')
          print('SEMANTIC_HANDOFF=PASS')
          print('REGISTRY_MUTATION=ABSENT')
          PY
          node --check janus-network-v3.js
      - name: Commit migrated janus.html on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- janus.html; then
            echo 'No migration diff.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add janus.html
            git commit -m 'feat(hrain): activate JANUS network language and semantic handoff'
            git push
          fi
      - name: Request Pages rebuild
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds" >/tmp/pages.json
          cat /tmp/pages.json
