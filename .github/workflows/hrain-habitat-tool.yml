name: HRaiN Habitat structural tool

on:
  pull_request:
    paths:
      - 'habitat-tool.js'
      - 'demihead-bridge.js'
      - 'tools/test-habitat-tool.js'
      - '.github/workflows/hrain-habitat-tool.yml'
  push:
    branches: [main]
    paths:
      - 'habitat-tool.js'
      - 'demihead-bridge.js'
      - 'tools/test-habitat-tool.js'
      - '.github/workflows/hrain-habitat-tool.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and unit tests
        run: |
          node --check habitat-tool.js
          node --check demihead-bridge.js
          node tools/test-habitat-tool.js
      - name: CLI smoke
        run: |
          printf '%s\n' '{"schema":"janus.habitat.hrain.request.v1","request_id":"CI-HRAIN-0001","operation":"STRUCTURE_CONTEXT","captured_at":"2026-08-16T00:00:00Z","workspace":{"nodes":[{"id":"a","label":"A"},{"id":"b","label":"B"}],"links":[{"source":"a","target":"b"}]}}' | node habitat-tool.js >/tmp/hrain.json
          node - <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('/tmp/hrain.json','utf8'));
          if(v.status!=='STRUCTURE_READY_OPTIONAL') throw new Error('status');
          if(v.packet.hemisphere!=='LEFT_HRAIN') throw new Error('hemisphere');
          if(v.source_mutation_allowed!==false) throw new Error('mutation boundary');
          if(v.network_used_by_tool!==false) throw new Error('network boundary');
          console.log('HRAIN_HABITAT_CLI=PASS');
          NODE
