name: TEMP HRAiN TOPA semantic quality branch patch

on:
  push:
    branches: [janus/topa-continuous-semantic-flywheel]
    paths:
      - 'tools/_patch_semantic_quality_once.py'
      - '.github/workflows/_branch-semantic-quality-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: janus/topa-continuous-semantic-flywheel
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply cross-concept semantic filter patch
        run: python tools/_patch_semantic_quality_once.py
      - name: Commit semantic adapter patch only
        run: |
          set -euo pipefail
          git config user.name 'janus-activator[bot]'
          git config user.email 'janus-activator[bot]@users.noreply.github.com'
          git add tools/hrain_topa_semantic_overlay.py
          if git diff --cached --quiet; then
            echo 'HRAIN_TOPA_QUALITY_PATCH_NOOP=TRUE'
            exit 0
          fi
          git commit -m 'HRaiN: reserve TOPA semantic degree for cross-concept links'
          git push origin HEAD:janus/topa-continuous-semantic-flywheel
