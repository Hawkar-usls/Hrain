<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HRAIN · Unified Memory v2 · Isolated preview</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}
body{background:#071018;color:#e0e8ef;font-family:system-ui,sans-serif;margin:0;padding:2rem}
main{max-width:1100px;margin:auto}
h1{letter-spacing:.02em;color:#d9fff1}
small,.muted{color:#92aaba}
header{border-bottom:1px solid #36505b;margin-bottom:1rem;padding-bottom:1rem}
.notice{padding:1rem;border:1px solid #356b66;border-radius:12px;background:#0b2023}
label{display:block;margin:.6rem 0}
input[type=file],input[type=search],select{font-size:1rem;color:inherit;background:#122b35;border:1px solid #55727c;border-radius:9px;padding:.7rem;max-width:100%}
input[type=search]{min-width:280px;flex:1}
.umv2-toolbar{display:flex;gap:.8rem;flex-wrap:wrap;margin:1rem 0}
.umv2-docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:.7rem}
.umv2-doc{border:1px solid #244b53;border-radius:10px;padding:.8rem;min-width:0;background:#0c2129}
.umv2-doc a{color:#8fe9e1;overflow-wrap:anywhere}
.umv2-doc small{display:block;margin:.4rem 0;overflow-wrap:anywhere}
.umv2-doc button{color:#bff0e9;background:transparent;border:1px solid #3a7174;border-radius:6px;padding:.35rem;cursor:pointer}
.umv2-related{display:grid;gap:.4rem;margin-top:.6rem}
.umv2-status{font-weight:600}
#feedback{min-height:1.8rem}
</style>
<script defer src="assets/janus-unified-memory-v2-stage.js"></script>
</head>
<body><main>
<header>
<h1>HRAIN · Unified Memory v2</h1>
<p class="muted">Тестовый режим · только чтение · исходный HRain и NAS не меняются</p>
</header>
<section class="notice">
<p>Выберите экспорт <code>graph.json</code>, полученный из изолированного индекса Meta Registry. Файл читается только в браузере, никуда не отправляется.</p>
<label for="graph-file">JSON-проекция Meta Registry</label>
<input id="graph-file" type="file" accept=".json,application/json">
<p id="feedback" role="status" class="muted">Ожидание тестовой проекции</p>
</section>
<section id="mount" aria-label="Unified Memory v2"></section>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var input = document.getElementById("graph-file");
  var output = document.getElementById("feedback");
  input.addEventListener("change",async function(){
    var file=input.files && input.files[0];
    if (!file)return;
    try {
      var result=await window.JANUSUnifiedMemoryV2.fromFile(file,document.getElementById("mount"));
      output.textContent="Контракт проверен: "+result.nodes+" JSON / "+result.links+" явных связей";
    } catch(e) {
      document.getElementById("mount").replaceChildren();
      output.textContent="Импорт заблокирован: "+(e && e.message || "неизвестная ошибка");
    }
  });
});
</script>
</body></html>
